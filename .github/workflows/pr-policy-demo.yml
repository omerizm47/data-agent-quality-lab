name: PR policy demo reviewer

on:
  pull_request_target:
    branches: ['demo/pr-policy']
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-policy-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-review:
    name: Evaluate isolated demo policy
    if: github.event.pull_request.base.ref == 'demo/pr-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Evaluate PR metadata and publish the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node demo/pr-policy/scripts/github-review.mjs